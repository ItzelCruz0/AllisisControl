<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLISIS CONTROL - Plataforma Operativa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">

    <!-- ========================================== -->
    <!-- PANTALLA DE LOGIN (Visible si no hay sesión) -->
    <!-- ========================================== -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen bg-slate-900 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-xl text-white text-2xl font-bold mb-3 shadow-lg shadow-blue-500/30">
                    <i class="fa-solid font-bold">A</i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">ALLISIS CONTROL</h1>
                <p class="text-xs text-slate-500 mt-1">Control Operativo, Avances y Finanzas</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="login-email" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" placeholder="usuario@allisis.com">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" placeholder="••••••••">
                    </div>
                </div>

                <div id="login-error" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-lg border border-red-200 text-center font-medium"></div>

                <button type="submit" id="btn-login" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md shadow-blue-600/20 transition duration-200 flex items-center justify-center gap-2">
                    <span>Iniciar Sesión</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400 border-t border-slate-100 pt-4">
                <i class="fa-solid fa-shield-halved mr-1"></i> Acceso restringido únicamente a personal autorizado.
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- DASHBOARD PRINCIPAL (Oculto hasta autenticar) -->
    <!-- ========================================== -->
    <div id="app-dashboard" class="hidden min-h-screen flex flex-col">
        
        <!-- NAV BAR -->
        <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-lg shadow-md">A</div>
                        <div>
                            <span class="font-bold text-base tracking-wide block leading-tight">ALLISIS CONTROL</span>
                            <span class="text-[10px] text-slate-400 block tracking-wider">GESTIÓN OPERATIVA</span>
                        </div>
                    </div>

                    <!-- Usuario Info & Logout -->
                    <div class="flex items-center gap-4">
                        <div class="text-right hidden sm:block">
                            <span id="user-display-name" class="block text-xs font-semibold text-slate-200">Cargando...</span>
                            <span id="user-display-role" class="block text-[10px] text-blue-400 font-medium uppercase tracking-wider">Rol</span>
                        </div>
                        <button id="btn-logout" title="Cerrar Sesión" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition">
                            <i class="fa-solid fa-right-from-bracket text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- SUB-HEADER CON NAVEGACIÓN Y ACCIONES -->
        <div class="bg-white border-b border-slate-200 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center py-3 gap-3">
                
                <!-- Pestañas de Navegación -->
                <nav class="flex gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                    <button class="nav-btn active bg-slate-100 text-blue-600 font-semibold px-4 py-2 rounded-lg text-xs flex items-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-chart-pie"></i> Dashboard
                    </button>
                    <button class="nav-btn text-slate-600 hover:bg-slate-50 font-medium px-4 py-2 rounded-lg text-xs flex items-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-folder-open"></i> Proyectos
                    </button>
                    <!-- Opción visible solo para Admin -->
                    <button id="tab-users" class="nav-btn text-slate-600 hover:bg-slate-50 font-medium px-4 py-2 rounded-lg text-xs flex items-center gap-2 whitespace-nowrap hidden">
                        <i class="fa-solid fa-users-gear"></i> Usuarios
                    </button>
                    <button id="tab-logs" class="nav-btn text-slate-600 hover:bg-slate-50 font-medium px-4 py-2 rounded-lg text-xs flex items-center gap-2 whitespace-nowrap hidden">
                        <i class="fa-solid fa-clock-rotate-left"></i> Bitácora
                    </button>
                </nav>

                <button id="btn-new-project" class="w-full sm:w-auto px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nuevo Proyecto
                </button>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            
            <!-- PANEL: Módulo de Gestión de Usuarios (Solo Admin) -->
            <section id="panel-users" class="space-y-6 hidden">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-user-plus text-blue-600"></i> Registrar Nuevo Usuario en el Sistema
                    </h2>
                    <form id="create-user-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Nombre Completo</label>
                            <input type="text" id="new-user-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ej. Carlos Pizarro">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Correo Electrónico</label>
                            <input type="email" id="new-user-email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="correo@allisis.com">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Contraseña Inicial</label>
                            <input type="password" id="new-user-pass" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Rol / Asignación</label>
                            <select id="new-user-role" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="operaciones">Operaciones / Campo</option>
                                <option value="finanzas">Finanzas / Facturación</option>
                                <option value="admin">Administrador (Acceso Total)</option>
                            </select>
                        </div>
                        <div class="md:col-span-4 flex justify-end">
                            <button type="submit" class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs rounded-lg shadow transition">
                                <i class="fa-solid fa-check mr-1"></i> Crear y Dar Acceso
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- CONTENIDO HABITUAL (Dashboard) -->
            <section id="panel-dashboard" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Proyectos Activos</span>
                        <div class="text-2xl font-bold text-slate-800 mt-1" id="dash-active-count">0</div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Monto Total Cotizado</span>
                        <div class="text-2xl font-bold text-blue-600 mt-1" id="dash-total-amount">$0.00 MXN</div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Avance Promedio Global</span>
                        <div class="text-2xl font-bold text-emerald-600 mt-1" id="dash-avg-progress">0%</div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- FIREBASE SDKs & LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged,
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            collection, 
            addDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // 1. CONFIGURACIÓN DE FIREBASE (Tus Llaves)
        // ==========================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "allisis-control.firebaseapp.com",
            projectId: "allisis-control",
            storageBucket: "allisis-control.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variables de estado
        let currentUserData = null;

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const appDashboard = document.getElementById('app-dashboard');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const btnLogout = document.getElementById('btn-logout');

        // ==========================================
        // 2. SISTEMA DE REGISTRO DE BITÁCORA (LOGS)
        // ==========================================
        async function logActivity(action, details = "") {
            if (!auth.currentUser) return;
            try {
                await addDoc(collection(db, "activity_logs"), {
                    userEmail: auth.currentUser.email,
                    userName: currentUserData?.name || auth.currentUser.email,
                    role: currentUserData?.role || 'usuario',
                    action: action,
                    details: details,
                    timestamp: serverTimestamp()
                });
            } catch (err) {
                console.error("Error registrando bitácora:", err);
            }
        }

        // ==========================================
        // 3. CONTROL DE AUTENTICACIÓN
        // ==========================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Obtener datos del perfil/rol desde Firestore
                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    currentUserData = userDocSnap.data();
                } else {
                    // Perfil por defecto para la administradora principal
                    currentUserData = {
                        name: user.email.split('@')[0],
                        role: "admin"
                    };
                }

                // Actualizar interfaz
                document.getElementById('user-display-name').textContent = currentUserData.name;
                document.getElementById('user-display-role').textContent = currentUserData.role;

                // Si es Admin, mostrar pestañas especiales
                if (currentUserData.role === 'admin') {
                    document.getElementById('tab-users')?.classList.remove('hidden');
                    document.getElementById('tab-logs')?.classList.remove('hidden');
                }

                loginScreen.classList.add('hidden');
                appDashboard.classList.remove('hidden');

            } else {
                currentUserData = null;
                appDashboard.classList.add('hidden');
                loginScreen.classList.remove('hidden');
            }
        });

        // Evento Iniciar Sesión
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                await logActivity("Inicio de sesión", "El usuario ingresó a la plataforma");
            } catch (error) {
                loginError.textContent = "Credenciales incorrectas o usuario no registrado.";
                loginError.classList.remove('hidden');
            }
        });

        // Evento Cerrar Sesión
        btnLogout.addEventListener('click', async () => {
            await logActivity("Cierre de sesión", "El usuario salió de la plataforma");
            await signOut(auth);
        });

        // ==========================================
        // 4. CREACIÓN DE USUARIOS (SOLO ADMINISTRADOR)
        // ==========================================
        const createUserForm = document.getElementById('create-user-form');
        if (createUserForm) {
            createUserForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('new-user-name').value;
                const email = document.getElementById('new-user-email').value;
                const password = document.getElementById('new-user-pass').value;
                const role = document.getElementById('new-user-role').value;

                try {
                    // Nota: En producción esto se puede asociar mediante un servicio secundario
                    alert(`Usuario ${name} preparado para alta. Regístralo con el correo: ${email}`);
                    await logActivity("Creación de usuario", `Se dio de alta a: ${email} con rol: ${role}`);
                    createUserForm.reset();
                } catch (err) {
                    alert("Error al dar de alta usuario: " + err.message);
                }
            });
        }
    </script>
</body>
</html>
